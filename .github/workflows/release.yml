name: Release

# A tag vX.Y.Z publishes a GitHub release with a Linux binary archive per
# system (see scripts/package-release.sh for the layout), each with a .sha256.
# Deployments run those archives; nothing deploys from a source build.
on:
  push:
    tags:
      - "v*.*.*"
    # A push to master runs the build jobs as a warm pass: they save the caches
    # a release restores, so a release (a hotfix too) compiles only the
    # workspace's own crates. A warm pass publishes nothing.
    branches:
      - master
  # A pull request that changes how releases are built gets a dry run.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package without publishing (a real release needs a tag ref)"
        required: false
        type: boolean
        default: true

# One release at a time; a newer push replaces an older warm pass or
# pull request dry run.
concurrency:
  group: ${{ github.ref_type == 'tag' && 'release' || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_OFFLINE: "true"

jobs:
  prepare-release:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      warm: ${{ steps.release.outputs.warm }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the version and decide what this run publishes
        id: release
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/server/Cargo.toml", "rb"))["package"]["version"])')
          warm=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            warm=true
            dry_run=true
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            dry_run=true
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            dry_run=$INPUT_DRY_RUN
          else
            dry_run=false
          fi
          if [ "$dry_run" != true ]; then
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              echo "A published release runs from its tag; dispatch on the tag or run a dry run." >&2
              exit 1
            fi
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match the server's version $version." >&2
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "revision=$GITHUB_SHA"
            echo "dry_run=$dry_run"
            echo "warm=$warm"
          } >> "$GITHUB_OUTPUT"
          echo "v$version from $GITHUB_SHA (dry_run=$dry_run, warm=$warm)" >> "$GITHUB_STEP_SUMMARY"

  # The browser modules, in parallel with the server builds; only packaging
  # needs both.
  wasm:
    name: Build browser WASM
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Compiled dependencies come from the cache master's warm pass writes;
      # only it saves, so a pull request can't change what a release links.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wasm
          save-if: ${{ needs.prepare-release.outputs.warm == 'true' }}
      - name: Install wasm-pack (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build locked browser modules
        run: |
          wasm-pack build crates/nostr_signer --target web --release --out-dir ../../ui/pkg/nostr_signer -- --locked
          wasm-pack build crates/game_engine --target web --release --out-dir ../../ui/pkg/game_engine -- --locked
          ls -l ui/pkg/*
      - if: needs.prepare-release.outputs.warm != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-pkg
          path: ui/pkg/
          if-no-files-found: error
          retention-days: 14

  server:
    name: Build server (${{ matrix.system }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - system: aarch64-linux
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The build needs the space only well after it has started.
      - name: Free disk space in the background
        run: |
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; apt-get clean' \
            >/dev/null 2>&1 &
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ needs.prepare-release.outputs.warm == 'true' }}
      # SQLite is bundled and OpenSSL vendored, so the executable needs only
      # the C runtime.
      - name: Build the locked release server
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" --bin server
      - name: Stage the server, its bundled assets, and migrations
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p staged
          cp "target/$TARGET/release/server" staged/server
          cp -R crates/server/static staged/static
          cp -R crates/server/migrations staged/migrations
          echo "Shared libraries:"
          objdump -p staged/server | awk '/NEEDED/ { print "  " $2 }'
          echo "Newest glibc symbol: $(objdump -T staged/server | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
      - if: needs.prepare-release.outputs.warm != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.system }}
          path: staged/
          if-no-files-found: error
          retention-days: 14

  # Only downloading, archiving, and hashing, once every build has finished.
  package:
    name: Package release archives
    needs: [prepare-release, wasm, server]
    if: needs.prepare-release.outputs.warm != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Assemble and hash each system's archive
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          REVISION: ${{ needs.prepare-release.outputs.revision }}
        run: |
          for system in x86_64-linux aarch64-linux; do
            # Artifacts drop file modes; the script sets them.
            scripts/package-release.sh "$VERSION" "$system" "$REVISION" \
              "built/server-$system/server" "built/server-$system/static" \
              "built/server-$system/migrations" built/ui-pkg release
          done
          {
            echo '```'
            cat release/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the GitHub release
    needs: [prepare-release, package]
    if: needs.prepare-release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Verify the archives and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          cd release
          sha256sum --check ./*.sha256
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --generate-notes ./*
