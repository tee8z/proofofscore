name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_OFFLINE: true
  SQLITE_DIR: ${{ github.workspace }}/.sqlite

jobs:
  # Format check (fast, no deps needed)
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  # Unused dependency check
  machete:
    name: Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - run: cargo machete --with-metadata

  # Clippy lint check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sqlite

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Pull requests restore master's cache but never write one.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sqlite

      - uses: dtolnay/rust-toolchain@stable

      # Pull requests restore master's cache but never write one.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: cargo test --workspace --locked

  # Build (x86_64) + WASM
  build-x86_64:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build doesn't need the space until well after it has started.
      - name: Free disk space (in the background)
        run: |
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc; docker image prune --all --force' \
            >/dev/null 2>&1 &

      - uses: ./.github/actions/setup-sqlite

      - uses: dtolnay/rust-toolchain@stable

      # Pull requests restore master's cache but never write one.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build workspace
        run: cargo build --workspace --release --locked

      - name: Install wasm-pack (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM modules
        run: |
          wasm-pack build crates/nostr_signer --target web --release --out-dir ../../ui/pkg/nostr_signer
          wasm-pack build crates/game_engine --target web --release --out-dir ../../ui/pkg/game_engine

      - name: Verify static files were built
        run: |
          echo "Checking build.rs output..."
          ls -la crates/server/static/
          if [ ! -f "crates/server/static/app.min.js" ]; then
            echo "Error: app.min.js not found"
            exit 1
          fi
          echo "Checking WASM output..."
          ls -la ui/pkg/nostr_signer/
          ls -la ui/pkg/game_engine/
          echo "All artifacts verified"

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-x86_64
          path: target/release/server
          retention-days: 7

      - name: Upload UI assets
        uses: actions/upload-artifact@v4
        with:
          name: ui-assets
          path: |
            ui/pkg/
            crates/server/static/
          retention-days: 7

  # Build (ARM64) using native ARM runner
  build-arm64:
    name: Build (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The build doesn't need the space until well after it has started.
      - name: Free disk space (in the background)
        run: |
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc; docker image prune --all --force' \
            >/dev/null 2>&1 &

      - uses: ./.github/actions/setup-sqlite

      - uses: dtolnay/rust-toolchain@stable

      # Pull requests restore master's cache but never write one. The
      # deploy workflow restores it too (same shared key).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-aarch64
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build workspace
        run: cargo build --workspace --release --locked

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-aarch64
          path: target/release/server
          retention-days: 7

  # End-to-end tests (reuses x86_64 build artifacts)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sqlite

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-x86_64
          path: ./bin

      - name: Download UI assets
        uses: actions/download-artifact@v4
        with:
          name: ui-assets

      - name: Set up server binary and test credentials
        run: |
          chmod +x ./bin/server
          mkdir -p creds
          echo '-----BEGIN EC PRIVATE KEY-----' > creds/test.pem
          echo '8eXd9bWq6qFJISxx4ggAvkxXPkv6/GyOTtvo0w1t4cg=' >> creds/test.pem
          echo '-----END EC PRIVATE KEY-----' >> creds/test.pem

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run e2e tests
        run: npx playwright test --project=chromium
        env:
          E2E_SERVER_BIN: ./bin/server

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Nix flake check
  nix-check:
    name: Nix Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # The Nix store, keyed on everything that changes the dependency
      # builds. Pull requests restore master's store but never save one.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/master' }}
          purge: ${{ github.ref == 'refs/heads/master' }}
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Run flake check
        run: nix flake check
